name: check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check for a local Chrome/Edge (browser tests skip when absent)
        run: (google-chrome --version || chromium --version || echo "no chrome; browser tests will skip") || true
      - name: Smoke test (build, playtest, assets, wall, share, versions)
        run: node --test test/smoke.mjs
