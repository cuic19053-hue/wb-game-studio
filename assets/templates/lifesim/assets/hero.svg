  <rect x="84" y="212" width="42" height="18" rx="9" fill="#ffffff" stroke="#2b1b12" stroke-width="8"/>
  <rect x="130" y="212" width="42" height="18" rx="9" fill="#ffffff" stroke="#2b1b12" stroke-width="8"/>
